# Blueprint de Render (render.com) — deploy con plan gratis.
# Render lee este archivo al crear el servicio desde el repo de GitHub.
#
# Arquitectura resultante (un solo web service):
#   navegador → nginx (estáticos + /api) → gunicorn/Flask (mismo contenedor)
#                                        → keyvalue (Redis)
#
# Un solo servicio = un solo "despertar" (~1 min) en vez de la espera
# encadenada frontend→backend. Además, un servicio despierto 24/7 usa
# ~744 de las 750 horas gratis mensuales del workspace: entra justo,
# siempre que sea el ÚNICO servicio free del workspace.
#
# Ojo con el plan gratis:
#   - El servicio duerme tras 15 minutos sin tráfico y tarda ~1 min en
#     despertar. Se puede evitar con un ping externo cada 5 min a
#     /api/v1/health (UptimeRobot, cron-job.org): Render no lo prohíbe
#     explícitamente, pero su política de uso aceptable es gris — si el
#     proyecto crece, la opción correcta es un plan pago.
#   - La Key Value gratis guarda los datos solo en memoria: se pierden en
#     cada reinicio de la instancia (el caché se regenera, pero el
#     historial de precisión vuelve a empezar de cero).

services:
  - type: keyvalue
    name: clima-redis
    # Sin IPs permitidas: solo accesible por la red privada de Render
    ipAllowList: []
    plan: free

  - type: web
    name: clima-comarca
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    # El health check atraviesa nginx → gunicorn → Redis: verifica la
    # cadena completa, no solo que nginx responda estáticos
    healthCheckPath: /api/v1/health
    envVars:
      - key: FLASK_ENV
        value: production
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: clima-redis
          property: connectionString
      - key: CORS_ORIGINS
        value: https://clima-comarca.onrender.com
      # Mismo Redis que el caché: el límite de 120 req/min se comparte
      # entre los 2 workers de gunicorn en vez de duplicarse
      - key: RATE_LIMIT_STORAGE_URI
        fromService:
          type: keyvalue
          name: clima-redis
          property: connectionString
      # nginx del contenedor reenvía /api a gunicorn por localhost;
      # no hace falta configurarlo, el default de entrypoint.sh ya es
      # http://127.0.0.1:5000
