# Blueprint de Render (render.com) — deploy con plan gratis.
# Render lee este archivo al crear el servicio desde el repo de GitHub.
#
# Arquitectura resultante:
#   navegador → web (nginx, público) → web (backend Flask, URL pública)
#                                        → keyvalue (Redis)
# Los private services no tienen plan gratis en Render, así que el backend
# también es un web service: el navegador nunca lo llama directo, nginx le
# reenvía /api por HTTPS.
#
# Ojo con el plan gratis:
#   - El web service duerme tras 15 min sin tráfico y tarda ~1 min en despertar.
#   - La Key Value gratis expira a los 30 días (se puede renovar; el caché se
#     regenera solo, pero el historial de precisión vuelve a empezar de cero).

services:
  - type: keyvalue
    name: clima-redis
    # Sin IPs permitidas: solo accesible por la red privada de Render
    ipAllowList: []
    plan: free

  - type: web
    name: clima-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    healthCheckPath: /api/v1/health
    envVars:
      - key: FLASK_ENV
        value: production
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: clima-redis
          property: connectionString
      - key: CORS_ORIGINS
        value: https://clima-comarca.onrender.com
      # Mismo Redis que el caché: el límite de 120 req/min se comparte
      # entre los 2 workers de gunicorn en vez de duplicarse
      - key: RATE_LIMIT_STORAGE_URI
        fromService:
          type: keyvalue
          name: clima-redis
          property: connectionString

  - type: web
    name: clima-comarca
    runtime: docker
    dockerfilePath: ./frontend/Dockerfile
    dockerContext: ./frontend
    plan: free
    healthCheckPath: /
    envVars:
      # URL pública real del servicio backend en Render (el nombre puede
      # llevar sufijo si el nombre simple estaba ocupado). Si se recrea el
      # servicio, actualizar con la URL del panel (Connect).
      - key: API_UPSTREAM
        value: https://clima-backend-54jy.onrender.com
