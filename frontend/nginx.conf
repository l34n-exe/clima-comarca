server {
    listen ${PORT};
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # La app llama a /api/v1/...; se reenvía al backend de Flask
    location /api/ {
        proxy_pass ${API_UPSTREAM};
        # Render exige SNI en el handshake TLS hacia el upstream
        proxy_ssl_server_name on;
        # $proxy_host es el host del upstream (backend), no el del cliente:
        # si va el Host original, Render rutea la request de vuelta al frontend (loop → 508)
        proxy_set_header Host $proxy_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # El backend en free tier puede tardar ~1 min en despertar:
        # los defaults de nginx (60 s) cortan antes de que responda
        proxy_connect_timeout 75s;
        proxy_send_timeout 75s;
        proxy_read_timeout 90s;
    }

    # Los assets de Vite llevan hash en el nombre: se pueden cachear para siempre
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        try_files $uri =404;
    }

    # index.html no se cachea: cada deploy tiene que verse enseguida
    location = /index.html {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
    }

    # SPA: cualquier ruta que no sea archivo sirve index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
