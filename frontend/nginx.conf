server {
    listen ${PORT};
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # La cadena es navegador → Cloudflare → red interna de Render → nginx.
    # real_ip_recursive salta los proxies confiables (rangos privados de
    # Render y rangos públicos de Cloudflare) y toma la primera IP que no
    # lo es: el cliente real. Un X-Forwarded-For falso que mande el cliente
    # queda descartado, a diferencia de leer el primer valor del header.
    # Rangos privados (Render/red Docker):
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    # Rangos IPv4 publicados por Cloudflare (cloudflare.com/ips):
    set_real_ip_from 173.245.48.0/20;
    set_real_ip_from 103.21.244.0/22;
    set_real_ip_from 103.22.200.0/22;
    set_real_ip_from 103.31.4.0/22;
    set_real_ip_from 141.101.64.0/18;
    set_real_ip_from 108.162.192.0/18;
    set_real_ip_from 190.93.240.0/20;
    set_real_ip_from 188.114.96.0/20;
    set_real_ip_from 197.234.240.0/22;
    set_real_ip_from 198.41.128.0/17;
    set_real_ip_from 162.158.0.0/15;
    set_real_ip_from 104.16.0.0/13;
    set_real_ip_from 104.24.0.0/14;
    set_real_ip_from 172.64.0.0/13;
    set_real_ip_from 131.0.72.0/22;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # La app llama a /api/v1/...; se reenvía al backend de Flask
    location /api/ {
        proxy_pass ${API_UPSTREAM};
        # Los errores del upstream (backend dormido, reiniciando) se
        # reescriben como JSON para que el frontend los distinga de una
        # página de error HTML y los trate como "servidor despertando"
        proxy_intercept_errors on;
        error_page 502 = @api_bad_gateway;
        error_page 503 = @api_unavailable;
        error_page 504 = @api_gateway_timeout;
        # Render exige SNI en el handshake TLS hacia el upstream
        proxy_ssl_server_name on;
        # $proxy_host es el host del upstream (backend), no el del cliente:
        # si va el Host original, Render rutea la request de vuelta al frontend (loop → 508)
        proxy_set_header Host $proxy_host;
        proxy_set_header X-Real-IP $remote_addr;
        # $remote_addr ya es la IP real resuelta por realip: se envía sola,
        # sin la cadena XFF original (que puede venir falsificada)
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        # El backend en free tier puede tardar ~1 min en despertar:
        # los defaults de nginx (60 s) cortan antes de que responda
        proxy_connect_timeout 75s;
        proxy_send_timeout 75s;
        proxy_read_timeout 90s;
    }

    # Respuestas JSON cuando el backend no se puede alcanzar: el frontend
    # reintenta estos códigos y muestra body.error si se agota el tiempo
    location @api_bad_gateway {
        default_type application/json;
        return 502 '{"error":"El servidor no responde (bad gateway)"}';
    }
    location @api_unavailable {
        default_type application/json;
        return 503 '{"error":"El servicio no está disponible"}';
    }
    location @api_gateway_timeout {
        default_type application/json;
        return 504 '{"error":"El servidor tardó demasiado en responder"}';
    }

    # Los assets de Vite llevan hash en el nombre: se pueden cachear para siempre
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        try_files $uri =404;
    }

    # index.html no se cachea: cada deploy tiene que verse enseguida
    location = /index.html {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
    }

    # SPA: cualquier ruta que no sea archivo sirve index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
