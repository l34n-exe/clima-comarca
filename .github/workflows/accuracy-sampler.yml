name: accuracy-sampler

# Una vez por hora llama a /api/v1/accuracy/viedma, que registra en Redis
# una muestra de "estimación del modelo vs observación METAR" para esa
# hora UTC. Así el historial de precisión crece aunque nadie visite la
# app. El registro fusiona por hora, así que los delays típicos del cron
# de GitHub no generan duplicados. Cuesta ~2 llamadas a proveedores por
# hora (Open-Meteo y NOAA METAR), marginal contra sus límites. Ojo: si el
# servicio de Render está dormido, el request lo despierta (~1 min) y la
# muestra igual se registra.

on:
  schedule:
    # Minuto 37: desfasado de la hora en punto por la misma razon
    # que el keepalive evita el minuto 0
    - cron: '37 * * * *'
  workflow_dispatch:

permissions: {}

jobs:
  sample:
    runs-on: ubuntu-latest
    steps:
      - name: Registrar muestra de precision
        # --max-time 120 cubre el cold start del servicio dormido (~12-60s);
        # --retry reintenta timeouts/5xx para no registrar un run fallido
        run: curl -fsS --max-time 120 --retry 2 --retry-all-errors --retry-delay 10 https://clima-comarca.onrender.com/api/v1/accuracy/viedma
