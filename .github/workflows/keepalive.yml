name: keepalive

# Ping cada 5 minutos a /api/v1/health para que el servicio free de Render
# no duerma (duerme tras 15 min sin tráfico). El endpoint solo hace ping a
# Redis: no llama a los proveedores ni gasta su cuota. Un servicio despierto
# 24/7 usa ~744 de las 750 horas mensuales del workspace — tiene que ser el
# único servicio free. Ojo: los cron de GitHub son best-effort y bajo carga
# pueden demorarse; en un repo público sin actividad por 60 días GitHub
# desactiva los workflows programados (se rehabilita con un commit o a
# mano). Si se necesita garantía, usar UptimeRobot o cron-job.org
# (ver README).

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping health endpoint
        run: curl -fsS --max-time 60 --retry 2 --retry-all-errors https://clima-comarca.onrender.com/api/v1/health
